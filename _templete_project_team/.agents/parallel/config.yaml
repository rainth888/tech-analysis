version: 2
enabled: true
mode: optimistic-disjoint-files
team_mode: multi-role-collaborative

identity:
  actor_id_required: true
  role_id_required: true
  task_id_required: true
  allowed_roles:
    - PM
    - PO
    - AR
    - BE
    - FE
    - QA
    - OPS
    - AI

lanes:
  directory: .agents/parallel/lanes
  require_owned_paths: true
  enforce_role_owners_matrix: true
  owners_file: docs/collab/OWNERS.md
  allow_parallel_read: true
  allow_parallel_write_when_disjoint: true
  overlap_policy: fail_closed

leases:
  directory: .agents/parallel/leases
  acquire_method: atomic_mkdir
  heartbeat_minutes: 5
  stale_after_minutes: 30
  stale_takeover: user_or_proven_owner_exit_only
  resources:
    - task-metadata
    - collab-board
    - git-index
    - contract-freeze
    - db-migration
    - backend-build
    - frontend-build
    - ai-build
    - test-env
    - staging-env
    - image-output
    - target-device
    - serial-port
    - flasher
    - ota-install

git:
  require_git_index_lease_for_mutation: true
  explicit_path_staging_only: true
  forbid_add_all: true
  forbid_commit_all: true
  forbid_shared_stash: true
  one_lane_per_commit: true
  commit_format: "<type>(<task-id>-<role>): <summary>"
  head_change_policy: verify_intervening_paths

shared_metadata:
  require_task_metadata_lease: true
  files:
    - AGENTS.md
    - _STATE.md
    - _TASKLISTS.md
    - _STATE_HISTORY.md
    - _CHECKLISTS.md
    - docs/PLAN.md
    - docs/PROGRESS.md
    - docs/collab/BOARD.md
    - docs/collab/OWNERS.md
    - .agents/parallel/config.yaml

external_resources:
  require_target_device_lease_for_mutation: true
  serialize_reset_power_flash_env_ota: true
